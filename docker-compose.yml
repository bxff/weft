# Standalone Weft relay and uptime monitor. Enable the tls profile for Caddy.
# For error tracking, also load docker-compose.telemetry.yml.
services:
  # ---------------------------------------------------------------------------
  # TLS front (production VPS): Caddy terminates HTTPS with automatic
  # Let's Encrypt certs and proxies (WebSockets included) to the cloud store.
  # Needs WEFT_DOMAIN in .env + DNS pointing at the VPS + ports 80/443 open.
  # Leave the tls profile off if a tunnel or another proxy supplies HTTPS.
  # ---------------------------------------------------------------------------
  caddy:
    profiles: [tls]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      WEFT_DOMAIN: ${WEFT_DOMAIN:-}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - cloud

  # ---------------------------------------------------------------------------
  # Uptime dashboard (uptime-kuma): THE "is everything working" screen.
  # First run: open :3001, create the admin account, add monitors for
  # http://cloud:8080/api/health, the public https origin, and GlitchTip.
  # Gives history graphs + alerting (email/webhook) out of the box.
  # ---------------------------------------------------------------------------
  uptime:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma:/app/data

  # ---------------------------------------------------------------------------
  # weft cloud store
  # ---------------------------------------------------------------------------
  cloud:
    build:
      # Repo root context so packages/* workspace deps resolve in the image.
      context: .
      dockerfile: apps/cloud/Dockerfile
    restart: unless-stopped
    # Loopback-only publish: the public path is Caddy (TLS). Keeping 8080 on
    # 127.0.0.1 preserves local dev + ssh-tunnel access without exposing the
    # plaintext port to the internet.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      CLOUD_DB: /data/weft.db
      # Secret: Clerk backend key used to verify browser session JWTs.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      # Telemetry DSN (issued by GlitchTip after first-run setup, see SELFHOST.md).
      # Optional: leave empty to disable error reporting from the cloud server.
      SENTRY_DSN: ${CLOUD_SENTRY_DSN:-}
    volumes:
      - cloud-data:/data

volumes:
  cloud-data:
  uptime-kuma:
  caddy-data:
  caddy-config:
