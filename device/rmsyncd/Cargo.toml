[package]
name = "rmsyncd"
version = "0.1.0"
edition = "2021"
description = "Weft tablet daemon: D-Bus rm-sync impersonator + sync agent (mirrors the xochitl store to the hosted cloud)"

[dependencies]
tokio = { version = "1", features = ["full"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
axum = "0.8"
notify = "7"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# WebSocket client so the daemon reacts to cloud page.changed events instantly
# (sub-second web->tablet) instead of only on the poll tick. rustls to match
# reqwest (no openssl in the musl cross-build).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false }

tempfile = "3"
