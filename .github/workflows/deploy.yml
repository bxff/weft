name: Deploy Weft VPS
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/test-deploy.sh
      - name: Require a green CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --branch main --event push --limit 10 \
            --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true

  vps:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vps-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl, armv7-unknown-linux-musleabihf
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: '0.15.2'
      - run: cargo install cargo-zigbuild --locked
      - run: |
          cargo zigbuild --manifest-path device/Cargo.toml --locked --release --target aarch64-unknown-linux-musl
          cargo zigbuild --manifest-path device/Cargo.toml --locked --release --target armv7-unknown-linux-musleabihf
      - name: Preflight SSH and deploy prebuilt release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash scripts/deploy-vps-ci.sh
