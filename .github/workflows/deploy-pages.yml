name: Deploy Weft Pages

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: weft-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pages-production
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require a green CI run for this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          green=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
            --branch main --commit "$DEPLOY_SHA" --status success --limit 1 --json headSha \
            --jq '.[0].headSha // ""')
          if [[ "$green" != "$DEPLOY_SHA" ]]; then
            echo "CI has not passed on this exact main commit."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
      - run: bun install --frozen-lockfile

      - name: Build the production frontend
        working-directory: apps/web
        env:
          PUBLIC_CLOUD_URL: ${{ vars.PUBLIC_CLOUD_URL }}
          PUBLIC_WEFT_PAGES_ORIGIN: https://weft.page
          PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.PUBLIC_CLERK_PUBLISHABLE_KEY }}
          PUBLIC_TLDRAW_LICENSE_KEY: ${{ secrets.PUBLIC_TLDRAW_LICENSE_KEY }}
        run: |
          set -euo pipefail
          : "${PUBLIC_CLOUD_URL:?Configure PUBLIC_CLOUD_URL in pages-production}"
          : "${PUBLIC_CLERK_PUBLISHABLE_KEY:?Configure PUBLIC_CLERK_PUBLISHABLE_KEY in pages-production}"
          : "${PUBLIC_TLDRAW_LICENSE_KEY:?Configure PUBLIC_TLDRAW_LICENSE_KEY in pages-production}"
          bun run build
          test -s build/index.html
          test -s build/library.html
          node ../../scripts/prepare-pages-library.mjs

      - name: Install the pinned deploy tool without credentials
        run: npm install --prefix "$RUNNER_TEMP/weft-pages" --no-audit --no-fund wrangler@4.168.0

      - name: Direct upload to the configured Pages production branch
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure CLOUDFLARE_ACCOUNT_ID in pages-production}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Configure CLOUDFLARE_PAGES_PROJECT in pages-production}"
          : "${CLOUDFLARE_PAGES_PRODUCTION_BRANCH:?Configure CLOUDFLARE_PAGES_PRODUCTION_BRANCH in pages-production}"
          : "${CLOUDFLARE_API_TOKEN:?Configure CLOUDFLARE_API_TOKEN in pages-production}"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$DEPLOY_SHA" ]]; then
            echo "main has advanced. Dispatch the current commit after CI passes."
            exit 1
          fi
          unset GH_TOKEN
          "$RUNNER_TEMP/weft-pages/node_modules/.bin/wrangler" pages deploy apps/web/build \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch="$CLOUDFLARE_PAGES_PRODUCTION_BRANCH" \
            --commit-hash="$DEPLOY_SHA"
